<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SHAZIN // WORLD</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#d9f7ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{display:block;width:100%;height:100%;cursor:none}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:24px;right:24px;top:20px;display:flex;justify-content:space-between;gap:16px}.brand{font-size:14px;letter-spacing:.18em}.status{font-size:12px;color:#7cffc4}.panel{position:absolute;left:24px;bottom:24px;padding:14px 16px;border:1px solid #24404b;background:rgba(3,8,12,.78);backdrop-filter:blur(8px);max-width:360px}.panel b{color:#fff}.hint{font-size:11px;line-height:1.7;color:#91aeb8;margin-top:7px}.terminal{position:absolute;right:24px;bottom:24px;width:min(440px,calc(100vw - 48px));padding:16px;border:1px solid #24404b;background:rgba(2,6,9,.9);box-shadow:0 0 40px #0008;display:none;pointer-events:auto}.terminal.open{display:block}.termout{height:180px;overflow:auto;font-size:12px;line-height:1.6;color:#a9e9ff;white-space:pre-wrap}.input{display:flex;gap:8px}.input span{color:#7cffc4}.input input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit}.toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);padding:10px 16px;border:1px solid #3d6874;background:#071017dd;display:none;font-size:12px}.toast.show{display:block}.cross{position:absolute;width:16px;height:16px;transform:translate(-50%,-50%);border:1px solid #7cffc4;border-radius:50%;opacity:.75}</style></head><body><canvas id="c"></canvas><div class="cross" id="cross"></div><div class="hud"><div class="top"><div class="brand">SHAZIN // WORLD</div><div class="status">● SYSTEM ONLINE</div></div><div class="panel"><b id="title">WELCOME, VISITOR</b><div id="desc">Explore the world. Walk to a location and press E.</div><div class="hint">WASD / ARROWS — MOVE &nbsp; • &nbsp; E — INTERACT &nbsp; • &nbsp; T — TERMINAL</div></div><div class="toast" id="toast"></div><div class="terminal" id="terminal"><div class="termout" id="termout">SHAZIN.OS terminal\nType <b>help</b> to begin.\n</div><div class="input"><span>&gt;</span><input id="cmd" autocomplete="off" spellcheck="false"></div></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,keys={},mouse={x:0,y:0},cam={x:0,y:0},p={x:0,y:0,spd:2.6};const places=[{x:-520,y:-180,w:150,h:110,name:'AI LAB',desc:'Experiments, agents and machine intelligence.',color:'#6de7ff'},{x:280,y:-260,w:150,h:110,name:'ARCADE',desc:'Games, worlds and playable prototypes.',color:'#ff78dc'},{x:-300,y:280,w:150,h:110,name:'WEB DISTRICT',desc:'Interactive websites and interface experiments.',color:'#9cff7c'},{x:350,y:250,w:150,h:110,name:'SYSTEMS',desc:'Automation, tooling and strange machines.',color:'#ffd36d'},{x:0,y:0,w:130,h:90,name:'HOME',desc:'About Shazin — developer, builder, experimenter.',color:'#ffffff'}];function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='t')toggleTerminal();if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;document.getElementById('cross').style.left=e.clientX+'px';document.getElementById('cross').style.top=e.clientY+'px'});function toggleTerminal(){document.getElementById('terminal').classList.toggle('open');if(document.getElementById('terminal').classList.contains('open'))document.getElementById('cmd').focus()}const out=document.getElementById('termout'),inp=document.getElementById('cmd');inp.addEventListener('keydown',e=>{if(e.key!=='Enter')return;let v=inp.value.trim().toLowerCase();out.innerHTML+='&gt; '+v+'\n';let r={help:'about\nprojects\nskills\ngithub\nsecret\nclear',about:'Mohammed Shazin — developer / builder / experimenter.',projects:'AI LAB • ARCADE • WEB DISTRICT • SYSTEMS',skills:'JavaScript • Python • Web • Games • AI',github:'https://github.com/tertbyte',secret:'ACCESS GRANTED. You found the hidden channel. 🚀'}[v]||'command not found';if(v==='clear')out.innerHTML='';else out.innerHTML+=r+'\n';out.scrollTop=out.scrollHeight;inp.value=''});function worldToScreen(wx,wy){return[wx-cam.x+W/2+(mouse.x-W/2)*.015,wy-cam.y+H/2+(mouse.y-H/2)*.015]}function drawGrid(){x.strokeStyle='#10202a';x.lineWidth=1;let step=40;for(let gx=-1200;gx<=1200;gx+=step){let[sx]=worldToScreen(gx,0);x.beginPath();x.moveTo(sx,0);x.lineTo(sx,H);x.stroke()}for(let gy=-900;gy<=900;gy+=step){let[,sy]=worldToScreen(0,gy);x.beginPath();x.moveTo(0,sy);x.lineTo(W,sy);x.stroke()}}function building(a){let[sx,sy]=worldToScreen(a.x,a.y);x.save();x.shadowBlur=25;x.shadowColor=a.color;x.fillStyle='#0b151b';x.strokeStyle=a.color;x.lineWidth=1.5;x.fillRect(sx-a.w/2,sy-a.h/2,a.w,a.h);x.strokeRect(sx-a.w/2,sy-a.h/2,a.w,a.h);x.shadowBlur=0;x.fillStyle=a.color;x.font='bold 13px monospace';x.textAlign='center';x.fillText(a.name,sx,sy-5);x.fillStyle='#5d7a84';x.font='10px monospace';x.fillText('PRESS E',sx,sy+14);for(let i=0;i<5;i++){x.fillStyle=a.color+'55';x.fillRect(sx-a.w/2+12+i*25,sy+a.h/2-18,12,5)}x.restore()}function player(){let[sx,sy]=worldToScreen(p.x,p.y);x.save();x.translate(sx,sy);x.fillStyle='#dffaff';x.shadowBlur=18;x.shadowColor='#7cffc4';x.beginPath();x.arc(0,-18,9,0,Math.PI*2);x.fill();x.fillRect(-8,-8,16,25);x.strokeStyle='#7cffc4';x.lineWidth=4;x.beginPath();x.moveTo(-7,17);x.lineTo(-13,34);x.moveTo(7,17);x.lineTo(13,34);x.moveTo(-8,0);x.lineTo(-22,10);x.moveTo(8,0);x.lineTo(22,10);x.stroke();x.restore()}function update(){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){let l=Math.hypot(dx,dy);p.x+=dx/l*p.spd;p.y+=dy/l*p.spd}cam.x+=(p.x-cam.x)*.08;cam.y+=(p.y-cam.y)*.08}function interact(){let hit=places.find(a=>Math.abs(p.x-a.x)<a.w*.55&&Math.abs(p.y-a.y)<a.h*.55);if(hit){document.getElementById('title').textContent=hit.name;document.getElementById('desc').textContent=hit.desc;show(hit.name+' — '+hit.desc)}else show('Nothing nearby. Keep exploring.')}function show(t){let z=document.getElementById('toast');z.textContent=t;z.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>z.classList.remove('show'),2600)}function stars(){x.fillStyle='#d9f7ff';for(let i=0;i<90;i++){let xx=(i*97)%W,yy=(i*53)%H;x.globalAlpha=.25+((i*13)%50)/100;x.fillRect(xx,yy,1,1)}x.globalAlpha=1}function loop(){update();x.fillStyle='#05070b';x.fillRect(0,0,W,H);stars();drawGrid();for(const a of places)building(a);player();requestAnimationFrame(loop)}loop();</script></body></html>
